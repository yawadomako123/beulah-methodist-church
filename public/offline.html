<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1766" />
    <title>Offline · Beulah Methodist Church</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1f1766;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img {
        width: 112px;
        height: 112px;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 1.6rem;
        margin: 20px 0 8px;
      }
      p {
        color: #dedbf5;
        max-width: 22rem;
        margin: 0 auto 24px;
        line-height: 1.5;
      }
      button {
        background: #fff200;
        color: #1f1766;
        border: 0;
        border-radius: 10px;
        padding: 12px 22px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="" />
      <h1>You're offline</h1>
      <p>Beulah Methodist Church needs an internet connection to load church records. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
